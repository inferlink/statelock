# Release statelock-ai to PyPI and GitHub. Runs only when started by hand
# (Actions > Release > Run workflow), from main. The version is statelock.__version__
# (src/statelock/__init__.py), read from the built wheel; bump it on main first. A version
# that already has a tag is refused, and so is a commit since the last release without a
# DCO sign-off (dco.yml).
#
# GitHub setup (Settings > Environments > pypi): required reviewers, and deployment
# branches limited to main. PyPI setup: a trusted publisher for owner inferlink, repository
# statelock, workflow release.yml, environment pypi. No tokens are stored anywhere.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Fails fast on another branch, before the full CI run.
  main-only:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a branch other than main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases run from main only (this run is on $REF)"
          exit 1

  checks:
    needs: main-only
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  # Every commit since the last release is signed off (DCO).
  dco:
    needs: main-only
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dco.yml

  build:
    needs: [checks, dco]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Refuse a branch other than main   # publish and github-release check it again
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases run from main only (this run is on $REF)"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine packaging
          python -m build
          python -m twine check --strict dist/*
      - name: Read the version from the wheel
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          [wheel] = Path("dist").glob("*.whl")
          version = parse_wheel_filename(wheel.name)[1]
          print(f"version={version}")
          print(f"prerelease={'true' if version.is_prerelease else 'false'}")
          PY
      - name: Refuse a version that was already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::Could not check remote release tags (git ls-remote exit $status)"
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error::v$VERSION is already tagged: bump __version__ in src/statelock/__init__.py"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/statelock-ai/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # trusted publishing to PyPI
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* "${flags[@]}"
