# DEVELOPMENT SECRETS ONLY (credential injection, statelock/credentials.py).
# compose.dev.yaml mounts this as STATELOCK_SECRETS_FILE. Values come from the
# proxy's environment, never from this file; the mock OJS password is public.
# Agents type the placeholder {{secret:<name>}}; Statelock types the value.
secrets:
  - name: ojs_password
    agents: [ojs_screening_agent]
    url_contains: http://ojs-mock:8081/index.php/journal/login   # origin as the proxy's Chromium sees it, then the path
    value_env: OJS_PASSWORD
